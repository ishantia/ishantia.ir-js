<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Shantia Eslami - Portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Stores the path the visitor tried to reach, then redirects to the
      // real app at "/" so React Router can pick it back up.
      var path =
        window.location.pathname +
        window.location.search +
        window.location.hash;
      sessionStorage.redirect = path;
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
